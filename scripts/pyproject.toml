[project]
name = "governed-analytics-scripts"
version = "0.1.0"
description = "Dataset download and load scripts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.2.11",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

name: governed-analytics

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_DATABASE_URL: postgresql://app_rw:${APP_RW_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-copilot}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      LOADER_DB_PASSWORD: ${LOADER_DB_PASSWORD:?Set LOADER_DB_PASSWORD in .env}
      WAREHOUSE_RO_DB_PASSWORD: ${WAREHOUSE_RO_DB_PASSWORD:?Set WAREHOUSE_RO_DB_PASSWORD in .env}
      APP_RW_DB_PASSWORD: ${APP_RW_DB_PASSWORD:?Set APP_RW_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-copilot}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "${API_HOST_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-5180}:8080"
    depends_on:
      api:
        condition: service_healthy

  dagster:
    build:
      context: .
      dockerfile: orchestration/dagster_project/Dockerfile
    restart: unless-stopped
    environment:
      DAGSTER_HOME: /opt/dagster_home
      APP_DATABASE_URL: postgresql://app_rw:${APP_RW_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-copilot}
    ports:
      - "${DAGSTER_HOST_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:

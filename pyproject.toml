[project]
name = "governed-analytics-copilot"
version = "0.1.0"
description = "Meridian Data Copilot: governed natural language analytics over the Olist dataset"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "backend",
    "orchestration/dagster_project",
    "warehouse",
    "scripts",
]

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "ruff==0.14.0",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "bandit==1.8.6",
    "pip-audit==2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "backend", "scripts"]
extend-exclude = ["warehouse/dbt_project/target", "warehouse/dbt_project/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "PLR2004", "S105"]
"tests/**" = ["S101", "PLR2004"]
"backend/app/auth/service.py" = ["E501"]
"backend/app/db/seed.py" = ["E501"]
"backend/migrations/**" = ["E501"]
"backend/tests/test_auth.py" = ["E501"]
# Admin SQL assembles fixed column fragments and binds every value
# Orchestration and HTTP status handling: branches and status codes are the subject matter
"backend/app/pipeline/**" = ["E501", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0913"]
"backend/app/llm/**" = ["E501", "PLR2004"]
"backend/app/semantic/catalog.py" = ["E501"]
"backend/app/policy/loader.py" = ["E501"]
"backend/tests/test_llm_gateway.py" = ["E501", "PLC0415"]
"backend/tests/test_pipeline_live.py" = ["E501", "PLC0415"]
"backend/tests/test_pipeline_curated.py" = ["E501", "F811"]
# Test modules: fixtures are re-imported by name, SQL is generated test data, and property tests build SQL
"backend/tests/test_governance.py" = ["E501", "F811", "PLC0415"]
"backend/tests/test_property_sql.py" = ["S608"]
"backend/app/api/admin.py" = ["S608", "E501"]
# Dashboard SQL is built only from validated Filters and rendered literals, then guarded
"backend/app/dashboard/queries.py" = ["S608", "E501"]
"backend/app/ops/**" = ["S608", "E501"]
"backend/app/api/ops.py" = ["E501"]
"backend/app/dashboard/service.py" = ["E501"]
"backend/app/api/dashboard.py" = ["E501"]

"scripts/tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[project]
name = "governed-analytics-backend"
version = "0.1.0"
description = "Meridian Data Copilot API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.120.0",
    "uvicorn[standard]==0.38.0",
    "pydantic-settings==2.11.0",
    "structlog==25.4.0",
    "psycopg[binary]==3.2.11",
    "pyyaml==6.0.3",
    "fastembed==0.8.1",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "slowapi==0.1.10",
    "email-validator==2.3.0",
    "httpx==0.28.1",
    "sqlglot==30.21.0",
    "dbt-core==1.11.9",
    "dbt-postgres==1.10.0",
    "dbt-metricflow==0.15.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.4",
    "pytest==8.4.2",
    "mypy==1.18.2",
    "types-pyyaml==6.0.12.20250915",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
